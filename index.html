<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>in_class</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body>
    <header class="bg-[#F7F6FF] pt-[50px]">
      <nav
        class="w-[1320px] h-20 flex justify-center flex-row items-center m-auto"
      >
        <img src="./assets/svg/worktap 1.svg" alt="logo" />
        <ul class="flex gap-10 ml-[60px] mr-[166px] text-[#222222] w-[585px]">
          <li class="cursor-pointer">Биржа</li>
          <li class="cursor-pointer">Ворки</li>
          <li class="cursor-pointer">Конкурсы</li>
          <li class="cursor-pointer">Создать ворк</li>
          <li class="cursor-pointer">Создать заказ</li>
        </ul>
        <button
          class="w-[171px] h-10 rounded-[20px] mr-[30px] bg-[#F2F0FE] text-[#1DBF73] cursor-pointer hover:bg-[#1DBF73] hover:text-[#F2F0FE] transition duration-300"
        >
          Регистрация
        </button>
        <button
          class="w-[171px] h-10 rounded-[20px] mr-[30px] text-[#F2F0FE] bg-[#1DBF73] cursor-pointer hover:bg-[#68dea7] transition duration-300"
        >
          Войти
        </button>
      </nav>
      <div class="border-t-2 border-dashed border-black">
        <div class="w-[1322px] m-auto flex gap-[124px]">
          <div>
            <h1
              class="text-[36px] text-[#222222] font-bold mt-[110px] mb-[30px] leading-none tracking-[3px] mr-[7px]"
            >
              Покупайте фриланс-услуги<br />
              в <span class="text-emerald-700">два клика</span>
            </h1>
            <p class="mb-[50px] text-[20px] text-[#222222] font-medium leading-none">
              Ворк — единица работы продавца, которую <br>можно купить как товар в
              магазине
            </p>
            <div class="w-full max-w-md">
              <form
                class="w-[532px] flex items-center justify-between bg-[#F2F0FE] pl-[19px] rounded-full shadow"
              >
                <input
                  type="text"
                  placeholder="Что нужно сделать?"
                  class="flex-1 outline-none text-[#4c4963]"
                />
                <button
                  type="submit"
                  class="w-[154px] h-[60px] ml-3 bg-[#FBA457] text-white rounded-full hover:bg-orange-400 transition cursor-pointer transition duration-300"
                >
                  Найти
                </button>
              </form>
            </div>
            <p class="text-[#222222] text-[16px] font-medium mt-[50px] mb-5">Выберите рубрику, чтобы начать</p>
            <div class="flex gap-5 mb-5">
              <button class="w-[181px] h-[37px] rounded-[50px] bg-[#F2F0FE] text-[14px] text-[#222222] cursor-pointer hover:bg-[#cdcbd9] transition duration-300">Тексты и переводы</button>
              <button class="w-[124px] h-[37px] rounded-[50px] bg-[#F2F0FE] text-[14px] text-[#222222] cursor-pointer hover:bg-[#cdcbd9] transition duration-300">Разработка</button>
              <button class="w-24 h-[37px] rounded-[50px] bg-[#F2F0FE] text-[14px] text-[#222222] cursor-pointer hover:bg-[#cdcbd9] transition duration-300">Дизайн</button>
            </div>
            <div class="flex gap-5 mb-5">
              <button class="w-[196px] h-[37px] rounded-[50px] bg-[#F2F0FE] text-[14px] text-[#222222] cursor-pointer hover:bg-[#cdcbd9] transition duration-300">Аудио, видео монтаж </button>
              <button class="w-[186px] h-[37px] rounded-[50px] bg-[#F2F0FE] text-[14px] text-[#222222] cursor-pointer hover:bg-[#cdcbd9] transition duration-300">SEO и оптимизация</button>
            </div>
            <div class="flex gap-5 mb-5">
              <button class="w-[156px] h-[37px] rounded-[50px] bg-[#F2F0FE] text-[14px] text-[#222222] cursor-pointer hover:bg-[#cdcbd9] transition duration-300">Бизнес и жизнь</button>
              <button class="w-[181px] h-[37px] rounded-[50px] bg-[#F2F0FE] text-[14px] text-[#222222] cursor-pointer hover:bg-[#cdcbd9] transition duration-300">Соцсети и реклама</button>
              <button class="w-[148px] h-[37px] rounded-[50px] border border-[#FBA457] text-[14px] text-[#FBA457] cursor-pointer hover:bg-[#FBA457] hover:text-white transition duration-300">Все категории</button>
            </div>
          </div>
          <div class="pt-[38px] mb-[122px]"><img src="./assets/img/head_img.png" alt=""></div>
        </div>
      </div>
    </header>
    <main></main>
  </body>
</html>
